[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inais"
version = "0.1.0"
description = "INAIS — personal AI assistant: Telegram + Gmail + Binance + memory + voice"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "aiohttp>=3.9",
    "anthropic>=0.40",
    "openai>=1.50",
    "asyncpg>=0.29",
    "APScheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "python-binance>=1.0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/inais"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["B008"]

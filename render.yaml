# INAIS — Render Blueprint (production deploy).
#
#   Render dashboard → New → Blueprint → connect this repo → Apply.
#
# Render then prompts for every value marked `sync: false` (the secrets) and generates the
# webhook secret and path itself. Nothing secret lives in this file.
#
# After the first deploy, if you use Gmail:
#   Settings → Secret Files → add `google_oauth_client.json`
#   (it mounts at /etc/secrets/google_oauth_client.json, which GOOGLE_OAUTH_CLIENT_JSON points at)
#
# RENDER_EXTERNAL_URL is deliberately NOT declared here: Render injects it automatically and
# the webhook is registered from it. Declaring it would let a typo silently break delivery.

services:
  - type: web
    name: inais
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # $7/mo, always-on. The free plan sleeps after 15 idle minutes,
                           # which would stop Gmail polling, reminders, briefs and learning.
    numInstances: 1        # MUST stay 1: the APScheduler jobs run in-process, so a second
                           # instance would double-send every reminder, brief and poll.
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # ---------------- core (required) ----------------
      - key: RUN_MODE
        value: web                    # webhook server; `local` is laptop-only long polling
      - key: TELEGRAM_BOT_TOKEN
        sync: false                   # from @BotFather
      - key: OWNER_TELEGRAM_ID
        sync: false                   # your numeric id (ask @userinfobot) — the ONLY allowed user
      - key: PORT
        value: "10000"                # Render routes to this port
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true           # verified on every webhook request. Render's generated
                                      # value may contain + / = which Telegram rejects, so the
                                      # code filters it to A-Z a-z 0-9 _ - before use.
      - key: WEBHOOK_SECRET_PATH
        generateValue: true           # random URL path so the endpoint isn't guessable

      # ---------------- brain (required) ----------------
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false                   # Supabase → Connect → session pooler URI (port 5432)
      - key: BRAIN_PROVIDER
        value: auto                   # auto | openai | anthropic. Set "openai" to run the
                                      # whole brain on OpenAI (no Claude access needed).
      - key: AGENT_MODEL
        value: claude-sonnet-5        # tool-heavy turns, when the brain is Anthropic
      - key: OPENAI_AGENT_MODEL
        value: gpt-5                  # tool-heavy turns, when the brain is OpenAI
      - key: OPENAI_REASONING_EFFORT
        value: low                    # minimal|low|medium|high. GPT-5's thinking time is
                                      # most of a turn's latency; low keeps chat snappy.
      - key: TRIAGE_MODEL
        value: gpt-5-mini             # routing, email triage, cheap replies
      - key: SUBAGENT_MODEL
        value: claude-haiku-4-5       # parallel specialists + research synthesis
      - key: REFLECTION_MODEL
        value: claude-haiku-4-5       # nightly memory consolidation
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small # 1536 dims — must match the pgvector columns

      # ---------------- voice ----------------
      - key: STT_MODEL
        value: gpt-4o-mini-transcribe
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE
        value: nova
      - key: VOICE_REPLIES
        value: "true"                 # also reply to voice notes with a voice bubble

      # ---------------- Gmail (optional) ----------------
      - key: GOOGLE_OAUTH_CLIENT_JSON
        value: /etc/secrets/google_oauth_client.json
      - key: GMAIL_POLL_SECONDS
        value: "60"

      # ---------------- Binance (optional — READ-ONLY key only) ----------------
      - key: BINANCE_API_KEY
        sync: false                   # "Enable Reading" ONLY. Never enable withdrawals.
      - key: BINANCE_API_SECRET
        sync: false
      - key: BINANCE_SYMBOLS
        value: BTCUSDT,ETHUSDT        # symbols to pull trade history for
      - key: DAILY_SUMMARY_HOUR
        value: "8"

      # ---------------- reminders (alarm behaviour) ----------------
      - key: REMINDER_BURST
        value: "4"                    # ping messages per firing, deleted after the sound
      - key: REMINDER_NAG_MINUTES
        value: "3"                    # first re-ping delay; doubles each nag
      - key: REMINDER_MAX_NAGS
        value: "3"

      # ---------------- planner ----------------
      - key: MORNING_BRIEF_HOUR
        value: "7"
      - key: CALENDAR_ENABLED
        value: "false"                # true ⇒ re-run authorize_gmail.py for EVERY account

      # ---------------- study ----------------
      - key: STUDY_NUDGE_HOUR
        value: "17"                   # evening "today's focus" ping
      - key: REVIEW_CARD_HOUR
        value: "9"                    # daily spaced-repetition card

      # ---------------- GitHub (optional, READ-ONLY token) ----------------
      - key: GITHUB_TOKEN
        sync: false                   # fine-grained PAT with READ access only
      - key: GITHUB_REPOS
        value: Kuwguap/INAIS          # comma-separated owner/repo to watch for CI failures
      - key: GITHUB_POLL_MINUTES
        value: "15"

      # ---------------- Store (ogoffcl e-commerce) ----------------
      - key: OGOFFCL_BASE_URL
        sync: false                   # website root, e.g. https://ogoffcl.store
      - key: OGOFFCL_API_KEY
        sync: false                   # shared bot↔site secret (also set as BOT_SECRET on Vercel)

      # ---------------- sub-agent swarm ----------------
      - key: MAX_PARALLEL_SUBAGENTS
        value: "4"                    # concurrency cap; 512 MB fits ~4 comfortably

      # ---------------- growing brain (autonomous learning) ----------------
      - key: LEARNING_ENABLED
        value: "false"                # true ⇒ it researches topics while you're away
      - key: AUTONOMY_INTERVAL_MINUTES
        value: "30"                   # how often it considers a learning cycle
      - key: AUTONOMY_IDLE_MINUTES
        value: "45"                   # only learns after you've been quiet this long
      - key: AUTONOMY_TOPICS_PER_CYCLE
        value: "2"
      - key: AUTONOMY_DAILY_BUDGET_USD
        value: "1.0"                  # hard cap on self-directed spend per day
      - key: NN_ENABLED
        value: "true"                 # the trainable interest/importance network
      - key: NN_HIDDEN_DIM
        value: "32"                   # ceiling; stays linear until data justifies growth
      - key: NN_MIN_EXAMPLES
        value: "40"                   # won't train on less signal than this
      - key: SERPER_API_KEY
        sync: false                   # serper.dev key — preferred provider, ~2,500 free/month
      - key: TAVILY_API_KEY
        sync: false                   # optional alternative
      - key: GOOGLE_CSE_API_KEY
        sync: false                   # Google Programmable Search backup (needs GOOGLE_CSE_ID too)
      - key: GOOGLE_CSE_ID
        sync: false                   # the CX id — account-specific, so prompted not committed
      - key: BRAVE_API_KEY
        sync: false                   # optional alternative

      # ---------------- personality & proactivity ----------------
      - key: PROACTIVE_ENABLED
        value: "false"                # true ⇒ it may start conversations on its own
      - key: PROACTIVE_MAX_PER_DAY
        value: "3"
      - key: QUIET_HOURS_START
        value: "22"                   # no unprompted messages 22:00–08:00 local
      - key: QUIET_HOURS_END
        value: "8"
      - key: VOICE_NOTES_ENABLED
        value: "true"                 # it decides when a voice note beats text
      - key: PROACTIVE_MIN_ENGAGEMENT
        value: "0.3"                  # floor from the learned engagement net
      - key: PERSONA_TONE
        value: warm, direct           # playful | formal | deadpan | …
      - key: PERSONA_BREVITY
        value: concise                # concise | balanced | thorough
      - key: PERSONA_HUMOUR
        value: "true"

      # ---------------- weekly review ----------------
      - key: WEEKLY_REVIEW_DAY
        value: sun                    # mon..sun, in TIMEZONE
      - key: WEEKLY_REVIEW_HOUR
        value: "18"

      # ---------------- reading digest ----------------
      - key: READING_DIGEST_DAY
        value: sun                    # mon..sun, in TIMEZONE
      - key: READING_DIGEST_HOUR
        value: "20"

      # ---------------- tracking (applications + expenses from email) ----------------
      - key: DEFAULT_CURRENCY
        value: USD                    # fallback when a receipt doesn't state a currency

      # ---------------- ops ----------------
      - key: TIMEZONE
        value: UTC                    # set yours, e.g. Africa/Accra — all schedules follow it
      - key: MONTHLY_BUDGET_USD
        value: "50"                   # /usage alarm threshold
      - key: LOG_LEVEL
        value: INFO
